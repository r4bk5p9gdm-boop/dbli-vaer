name: VarselApp
options:
  bundleIdPrefix: no.mathias
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    DEVELOPMENT_TEAM: 775WDN88WN
    CODE_SIGN_STYLE: Automatic
targets:
  VarselApp:
    type: application
    platform: iOS
    sources: [VarselApp]
    entitlements:
      path: VarselApp/VarselApp.entitlements
      properties:
        com.apple.security.application-groups: [group.no.mathias.dblivaer]
    dependencies:
      - target: DbliVaerWidget
        embed: true
      - target: DbliVaerWatchApp
        embed: true
    info:
      path: VarselApp/Info.plist
      properties:
        CFBundleDisplayName: "D bli Vær!"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Brukes for å finne posisjonen din og avgjøre om du er i nærheten av et sted.
        NSLocationAlwaysAndWhenInUseUsageDescription: Brukes for å aktivere valgte værvarsler automatisk når du nærmer deg et lagret sted.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [no.mathias.VarselApp.refresh]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
  DbliVaerWidget:
    type: app-extension
    platform: iOS
    sources:
      - DbliVaerWidget
      - VarselApp/Models.swift
      - VarselApp/Planner.swift
      - VarselApp/SharedWidgetData.swift
      - VarselApp/WeatherActivityAttributes.swift
    entitlements:
      path: DbliVaerWidget/DbliVaerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.no.mathias.dblivaer]
    info:
      path: DbliVaerWidget/Info.plist
      properties:
        CFBundleDisplayName: "D bli Vær!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: no.mathias.VarselApp.DbliVaerWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DbliVaerWatchApp:
    type: application
    platform: watchOS
    sources:
      - DbliVaerWatchApp
      - VarselApp/Models.swift
      - VarselApp/Planner.swift
      - VarselApp/SharedWidgetData.swift
      - VarselApp/YrService.swift
    dependencies:
      - target: DbliVaerWatchWidget
        embed: true
    entitlements:
      path: DbliVaerWatchApp/DbliVaerWatchApp.entitlements
      properties:
        com.apple.security.application-groups: [group.no.mathias.dblivaer]
    info:
      path: DbliVaerWatchApp/Info.plist
      properties:
        CFBundleDisplayName: "D bli Vær!"
        WKCompanionAppBundleIdentifier: no.mathias.VarselApp
        WKApplication: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: no.mathias.VarselApp.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
  DbliVaerWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - DbliVaerWatchWidget
      - VarselApp/Models.swift
      - VarselApp/Planner.swift
      - VarselApp/SharedWidgetData.swift
    entitlements:
      path: DbliVaerWatchWidget/DbliVaerWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.no.mathias.dblivaer]
    info:
      path: DbliVaerWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "D bli Vær!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: no.mathias.VarselApp.watchkitapp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VarselAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VarselAppTests]
    dependencies:
      - target: VarselApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
